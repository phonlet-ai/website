<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Phonlet Wake — standalone example</title>
    <script>
      // Follow the theme chosen on the main site, else the system preference.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('phonlet-theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      :root {
        color-scheme: light dark;
      }
      :root[data-theme='light'] {
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
      }
      body {
        max-width: 640px;
        margin: 70px auto;
        padding: 25px;
        font:
          16px/1.7 system-ui,
          sans-serif;
        background: light-dark(#f8f7f2, #181818);
        color: light-dark(#252820, #efefef);
      }
      h1 {
        font-weight: 500;
        letter-spacing: -1px;
      }
      a {
        color: light-dark(#b83c20, #ec6a44);
      }
      button {
        padding: 12px 20px;
        border: 0;
        font: inherit;
        cursor: pointer;
        background: #c94322;
        color: #fffdf6;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      pre {
        min-height: 100px;
        padding: 20px;
        white-space: pre-wrap;
        border: 1px solid light-dark(#d7dccc, #3f3f3f);
        font:
          14px/1.8 ui-monospace,
          monospace;
      }
    </style>
  </head>
  <body>
    <a href="/docs/wake-word">← Browser quickstart</a>
    <h1>Say “computer.”</h1>
    <p>
      This page runs the Phonlet Wake browser SDK: the engine works in a Web Worker and the
      microphone audio stays in this tab. Use HTTPS or localhost.
    </p>
    <button id="start">Enable microphone</button>
    <button id="stop" disabled>Stop</button>
    <pre id="status" role="status">Ready when you are.</pre>

    <script type="module">
      import { WakeManager } from '/wake/capture.mjs';

      const PHRASE = 'computer';
      const status = document.querySelector('#status');
      const startButton = document.querySelector('#start');
      const stopButton = document.querySelector('#stop');
      let manager = null;

      const show = (message) => (status.textContent = message);

      async function stop(message = 'Stopped. Microphone released.') {
        const current = manager;
        manager = null;
        await current?.close();
        startButton.disabled = false;
        stopButton.disabled = true;
        show(message);
      }

      async function start() {
        startButton.disabled = true;
        stopButton.disabled = false;
        show('Opening microphone…');
        // The site's keyword file, narrowed to one phrase (keep "model" for the model check).
        const file = await fetch('/wake/keywords.json').then((r) => r.json());
        file.keywords = file.keywords.filter((k) => k.name === PHRASE);
        manager = new WakeManager({
          wake: { model: '/wake/model.pwake', keywords: file, sensitivity: 0.5 },
          onDetection: (event) =>
            show(`Detected: ${event.keyword}\n${new Date().toLocaleTimeString()}`),
          onError: (error) => stop(error.message),
        });
        try {
          await manager.start();
          show(`Listening. Say “${PHRASE}”.`);
        } catch (error) {
          await stop(
            error.name === 'NotAllowedError'
              ? 'Microphone access was denied. Allow access and try again.'
              : error.message,
          );
        }
      }

      startButton.addEventListener('click', start);
      stopButton.addEventListener('click', () => stop());
      window.addEventListener('pagehide', () => stop());
    </script>
  </body>
</html>
